<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="UbuntuID – South Africa's digital identity platform.">
  <!-- Every page is either signed-in or shows someone's verification result:
       none of it belongs in search engines. -->
  <meta name="robots" content="noindex, nofollow">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="UbuntuID">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon: South African coat of arms (CC BY-SA 4.0, Wikimedia Commons
       "Echando una mano" -- see docs/ASSET_CREDITS.md). SVG for browsers
       that support it, PNG fallback for the rest. -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg"/>
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>UbuntuID</title>
  <link rel="manifest" href="manifest.json">

  <style>
    /* Shown while the app downloads; removed on Flutter's first frame. */
    #app-loading {
      position: fixed; inset: 0; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      background: #FAFAF8; color: #1B1F1D;
      font: 600 18px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      transition: opacity .2s ease;
    }
    #app-loading img { width: 72px; height: auto; }
    #app-loading .bar { width: 160px; height: 4px; border-radius: 4px; background: #E3F3E9; overflow: hidden; }
    #app-loading .bar::after {
      content: ""; display: block; width: 40%; height: 100%; background: #00723F;
      border-radius: 4px; animation: app-loading 1.2s ease-in-out infinite;
    }
    @keyframes app-loading { from { transform: translateX(-100%); } to { transform: translateX(250%); } }
    @media (prefers-color-scheme: dark) {
      #app-loading { background: #10130F; color: #FFFFFF; }
      #app-loading .bar { background: #00512C; }
      #app-loading .bar::after { background: #4FAE78; }
    }
    @media (prefers-reduced-motion: reduce) {
      #app-loading .bar::after { animation: none; width: 100%; }
    }
  </style>

  <script>
    // Each tab has its own sign-in (see lib/services/tab_session_store.dart).
    // Supabase normally copies sign-ins and sign-outs to every open tab over a
    // BroadcastChannel; give each tab a private channel so it can't.
    (function () {
      var Native = window.BroadcastChannel;
      if (!Native) return;
      var tab = Math.random().toString(36).slice(2);
      window.BroadcastChannel = function (name) {
        var n = String(name);
        if (/^sb-.*-auth-token$/.test(n)) n += '-' + tab;
        return new Native(n);
      };
      window.BroadcastChannel.prototype = Native.prototype;
    })();
  </script>
</head>
<body>
  <div id="app-loading" role="status" aria-live="polite">
    <img src="favicon.svg" alt="">
    <span>Loading UbuntuID…</span>
    <div class="bar" aria-hidden="true"></div>
  </div>
  <script>
    function hideAppLoading() {
      var el = document.getElementById('app-loading');
      if (!el) return;
      el.style.opacity = '0';
      setTimeout(function () { el.remove(); }, 250);
    }
    window.addEventListener('flutter-first-frame', hideAppLoading);
    // Safety net: never leave the loading screen over the app.
    setTimeout(hideAppLoading, 30000);
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
